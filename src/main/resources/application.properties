spring.application.name=resqdrive
resqdrive.jwt.secret=resqdrive_secret_key_for_jwt_token_signing_must_be_very_long
resqdrive.jwt.expiration=86400000

# Database Configuration (Docker MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/resqdrive?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
